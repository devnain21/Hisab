services:
  - type: web
    name: hisab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_NAME
        value: nain_hisab
      - key: MONGO_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
